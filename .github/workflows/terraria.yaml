name: Terraria image

on:
  push:
    branches: [main]
    paths:
      - games/terraria/**
      - .github/workflows/terraria.yaml
  pull_request:
    paths:
      - games/terraria/**
      - .github/workflows/terraria.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraria-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/terraria
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Compose
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file .env.example config --quiet
      - name: Build test image
        run: docker build --platform linux/amd64 --tag terraria:test .
      - name: Run regression tests in image
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=${PWD}/test_server.py,dst=/opt/terraria/test_server.py,readonly" \
            --entrypoint python3 terraria:test -B -m unittest -v

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gene9831/terraria
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: games/terraria
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=terraria
          cache-to: type=gha,mode=max,scope=terraria
